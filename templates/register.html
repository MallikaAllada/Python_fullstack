<html lang="en">

    <link rel="stylesheet" href="{{url for('static',filename='css/style.css')}}">
    <title>Register Page</title>
</head>
<body>
    <header>register</header>
    <main>
        <h2>Student Registration</h2>
        <form>
            <label>Full Name</label><br>

            <label>Email</label><br>

            <label>Password</label><br>
            <input type="Password" placeholder="Enter Your Password"><br>
            <label>Date of Birth</label><br>
            <input type="date" placeholder="DOB"><br>
            <label>Gender</label><br>
            <input type="radio" name="gender">Male
            <input type="radio" name="gendre">Female
            <br><br>
            <label>Select Courses</label><br>
            <select>
                <option>Python Fullstack</option>
                <option>Java Fullstack</option>
            </select>
        </form>
    </main>
</body>
